[package]
name = "linux-clipboard-manager"
version = "0.1.0"
description = "A Ditto-style clipboard history manager for Linux"
authors = ["Yann Kost"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control", "image-data"] }
base64 = "0.23.1"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.54.1", features = ["time"] }
toml = "1.1.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["custom-protocol"]
# Serve the frontend from the embedded ui/ folder instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]
